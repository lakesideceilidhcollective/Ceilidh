<form
  action="https://formsubmit.co/lakesideceilidhcollective@gmail.com"
  method="POST">

  <!-- FormSubmit settings -->
  <input type="hidden" name="_subject" value="New Lakeside Ceilidh Band Enquiry">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="true">
  <input type="hidden" name="_next" value="https://YOUR-WEBSITE-URL/thank-you.html">

  <input
    type="text"
    name="Name"
    placeholder="Your name"
    autocomplete="name"
    required
  >

  <input
    type="email"
    name="Email"
    placeholder="Email address"
    autocomplete="email"
    required
  >

  <input
    type="tel"
    name="Phone"
    placeholder="Phone number"
    autocomplete="tel"
  >

  <select name="Event type" required>
    <option value="">What are you celebrating?</option>
    <option>Wedding</option>
    <option>Birthday</option>
    <option>Private Party</option>
    <option>Other Event</option>
  </select>

  <input
    type="date"
    name="Event date"
  >

  <input
    type="text"
    name="Location"
    placeholder="Event location"
  >

  <select name="Optional extras">
    <option value="">Interested in any extras?</option>
    <option>Disco Till Late</option>
    <option>DJ Till Late</option>
    <option>Enhanced Lighting Rig</option>
    <option>Multiple Extras</option>
    <option>Not Sure Yet</option>
  </select>

  <textarea
    name="Message"
    placeholder="Tell us about your plans, guests and anything else you'd like us to know..."
  ></textarea>

  <button class="btn" type="submit">
    Request My Quote
  </button>

</form>
